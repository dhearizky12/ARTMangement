name: CI

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: bantubantu
                    POSTGRES_PASSWORD: bantubantu-ci
                    POSTGRES_DB: bantubantu_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U bantubantu -d bantubantu_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Restore
              run: dotnet restore backend/BantuBantu.sln

            - name: Install EF Core CLI
              run: |
                  dotnet tool install --global dotnet-ef --version "10.*"
                  echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

            - name: Check for un-migrated model changes
              env:
                  # Design-time factory resolves DATABASE_URL_UNPOOLED first; the
                  # model comparison is offline and never opens a connection.
                  DATABASE_URL_UNPOOLED: postgresql://dummy:dummy@127.0.0.1:5/dummy
              run: |
                  dotnet ef migrations has-pending-model-changes \
                    --project backend/BantuBantu.Infrastructure \
                    --startup-project backend/BantuBantu.Api

            - name: Build (Release)
              run: dotnet build backend/BantuBantu.sln -c Release --no-restore

            - name: Test
              env:
                  # AuthFactory requires BANTUBANTU_TEST_DB and uses it as the
                  # only connection string; there is no fallback to any other
                  # database. sslmode=disable is required because the URI
                  # resolver defaults to SslMode.Require and the throwaway
                  # container has no TLS.
                  BANTUBANTU_TEST_DB: postgresql://bantubantu:bantubantu-ci@127.0.0.1:5432/bantubantu_test?sslmode=disable
              run: |
                  # Guard: tests must never see an ambient database setting.
                  test -z "${DATABASE_URL:-}"
                  test -z "${DATABASE_URL_UNPOOLED:-}"
                  test -z "${ConnectionStrings__Default:-}"
                  dotnet test backend/BantuBantu.sln -c Release --no-build \
                    --logger "trx;LogFileName=test-results.trx" \
                    --results-directory "${{ runner.temp }}/TestResults"

            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-test-results
                  path: ${{ runner.temp }}/TestResults
                  if-no-files-found: ignore

            - name: Vulnerable packages (informational)
              if: always()
              continue-on-error: true
              run: dotnet list backend/BantuBantu.sln package --vulnerable --include-transitive

    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Test
              working-directory: frontend
              run: npm test

            - name: Typecheck and build
              working-directory: frontend
              env:
                  VITE_API_BASE_URL: https://api.example.invalid
                  VITE_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
              run: npm run build

            - name: Dependency audit (informational)
              if: always()
              continue-on-error: true
              working-directory: frontend
              run: npm audit --omit=dev --audit-level=high

    repo-hygiene:
        name: Repository hygiene
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fail if sensitive files are tracked
              run: |
                  set -euo pipefail
                  tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\..*|(^|/)\.deploy/|\.pem$|\.publishSettings$' | grep -v '\.example$' || true)
                  if [ -n "$tracked" ]; then
                    echo "::error::Sensitive files are tracked in git:"
                    printf '%s\n' "$tracked"
                    exit 1
                  fi
                  echo "OK: no .env / .deploy/ / .pem / .publishSettings files tracked."

            - name: actionlint (pinned v1.7.12)
              run: |
                  set -euo pipefail
                  VERSION=1.7.12
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
                  ./actionlint -color

            - name: deploy.yml env/secret cross-check
              run: python3 scripts/check-deploy-env.py

            - name: shellcheck (errors only)
              run: shellcheck --severity=error deploy-be.sh scripts/*.sh

            - name: gitleaks on PR commits (redacted, pinned v8.30.1)
              run: |
                  set -euo pipefail
                  VERSION=8.30.1
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
                  else
                    RANGE="origin/${{ github.event.repository.default_branch }}..HEAD"
                  fi
                  count=$(git rev-list --count "$RANGE")
                  if [ "$count" -eq 0 ]; then
                    echo "No commits in $RANGE to scan."
                    exit 0
                  fi
                  echo "Scanning $count commit(s) in $RANGE"
                  ./gitleaks git --log-opts="$RANGE" --redact --no-banner

    ci-gate:
        name: CI Gate
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        needs: [backend, frontend, repo-hygiene]
        steps:
            - name: Require every needed job to succeed
              run: |
                  set -euo pipefail
                  results="${{ join(needs.*.result, ' ') }}"
                  echo "Needed job results: $results"
                  for result in $results; do
                    if [ "$result" != "success" ]; then
                      echo "::error::CI Gate: needed job finished with '$result'."
                      exit 1
                    fi
                  done
                  echo "CI Gate: all needed jobs succeeded."
