name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      seed_accounts:
        description: "Seed one configured demo account for each role after migrations"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate Neon production database
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      ConnectionStrings__Default: ${{ secrets.DATABASE_URL_UNPOOLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply migrations with the direct Neon URL
        run: |
          test -n "$DATABASE_URL_UNPOOLED"
          dotnet ef database update \
            --project backend/BantuBantu.Infrastructure \
            --startup-project backend/BantuBantu.Api

      - name: Seed demo accounts (optional)
        if: ${{ inputs.seed_accounts }}
        env:
          SeedAccounts__Customer__GoogleSubject: ${{ secrets.SEED_ACCOUNTS_CUSTOMER_GOOGLE_SUBJECT }}
          SeedAccounts__SharedPassword: ${{ secrets.SEED_ACCOUNTS_SHARED_PASSWORD }}
        run: |
          for key in \
            SeedAccounts__SharedPassword \
            SeedAccounts__Customer__GoogleSubject; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub secret for $key" >&2
              exit 1
            fi
          done
          dotnet run --project backend/BantuBantu.Api --no-launch-profile -- --seed-accounts
