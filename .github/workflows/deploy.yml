name: Deploy Bantu-Bantu

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    backend:
        name: Deploy backend to MonsterASP.NET
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # One backend deploy at a time: two quick pushes to main must not race
        # on the same /wwwroot. The second run waits, then deploys in turn.
        concurrency:
            group: deploy-backend
            cancel-in-progress: false
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
            GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
            JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
            # Not secrets (plain numeric TTLs); reading them via vars stops
            # GitHub from masking "15"/"7" across every log line.
            JWT_ACCESS_MINUTES: ${{ vars.JWT_ACCESS_MINUTES }}
            JWT_REFRESH_DAYS: ${{ vars.JWT_REFRESH_DAYS }}
            FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
            MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
            # Resend (sending key stays out of job env; see the restore step below)
            RESEND_FROM: ${{ secrets.RESEND_FROM }}
            EMAIL_VERIFICATION_ENABLED: ${{ vars.EMAIL_VERIFICATION_ENABLED }}
            # 2FA email-code settings (staging repo variables; runtime defaults
            # apply when unset). Enabling 2FA requires RESEND_FROM + the
            # sending-only key, enforced by deploy-be.sh and Program.cs.
            TWO_FACTOR_ENABLED: ${{ vars.TWO_FACTOR_ENABLED }}
            TWO_FACTOR_PROVIDER_PASSWORD_FALLBACK: ${{ vars.TWO_FACTOR_PROVIDER_PASSWORD_FALLBACK }}
            TWO_FACTOR_CODE_TTL_MINUTES: ${{ vars.TWO_FACTOR_CODE_TTL_MINUTES }}
            TWO_FACTOR_MAX_ATTEMPTS: ${{ vars.TWO_FACTOR_MAX_ATTEMPTS }}
            TWO_FACTOR_RESEND_COOLDOWN_SECONDS: ${{ vars.TWO_FACTOR_RESEND_COOLDOWN_SECONDS }}
            TWO_FACTOR_MAX_RESENDS_PER_HOUR: ${{ vars.TWO_FACTOR_MAX_RESENDS_PER_HOUR }}
            TWO_FACTOR_MAX_SKIPS_PER_HOUR: ${{ vars.TWO_FACTOR_MAX_SKIPS_PER_HOUR }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Restore persistent RSA key pair
              env:
                  DEPLOY_RSA_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_RSA_PRIVATE_KEY_B64 }}
                  DEPLOY_RSA_PUBLIC_KEY_B64: ${{ secrets.DEPLOY_RSA_PUBLIC_KEY_B64 }}
              run: |
                  set -euo pipefail
                  test -n "$DEPLOY_RSA_PRIVATE_KEY_B64"
                  test -n "$DEPLOY_RSA_PUBLIC_KEY_B64"
                  install -d -m 700 .deploy/monsterasp
                  printf '%s' "$DEPLOY_RSA_PRIVATE_KEY_B64" | base64 --decode > .deploy/monsterasp/private.pem
                  printf '%s' "$DEPLOY_RSA_PUBLIC_KEY_B64" | base64 --decode > .deploy/monsterasp/public.pem
                  chmod 600 .deploy/monsterasp/private.pem
                  chmod 644 .deploy/monsterasp/public.pem

            - name: Restore persistent Resend sending key
              env:
                  RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
              run: |
                  set -euo pipefail
                  if [ -z "$RESEND_SENDING_API_KEY" ]; then
                    echo "Missing GitHub secret RESEND_SENDING_API_KEY." >&2
                    echo "Provision it locally with scripts/provision-resend-key.sh, then run:" >&2
                    echo "  gh secret set RESEND_SENDING_API_KEY < .deploy/monsterasp/resend_api_key" >&2
                    exit 1
                  fi
                  install -d -m 700 .deploy/monsterasp
                  printf '%s' "$RESEND_SENDING_API_KEY" > .deploy/monsterasp/resend_api_key
                  chmod 600 .deploy/monsterasp/resend_api_key

            - name: Reconstruct deploy environment
              run: |
                  set -euo pipefail
                  write_env() { printf '%s=%q\n' "$1" "$2"; }
                  : > .env
                  write_env DATABASE_URL "$DATABASE_URL" >> .env
                  write_env DATABASE_URL_UNPOOLED "$DATABASE_URL_UNPOOLED" >> .env
                  write_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" >> .env
                  write_env JWT_AUDIENCE "$JWT_AUDIENCE" >> .env
                  write_env JWT_ACCESS_MINUTES "${JWT_ACCESS_MINUTES:-15}" >> .env
                  write_env JWT_REFRESH_DAYS "${JWT_REFRESH_DAYS:-7}" >> .env
                  write_env FRONTEND_ORIGIN "${FRONTEND_ORIGIN:-https://art-mngmnt.web.app}" >> .env
                  write_env MONSTERASP_FTP_PASSWORD "$MONSTERASP_FTP_PASSWORD" >> .env
                  write_env RESEND_FROM "${RESEND_FROM:-}" >> .env
                  write_env EMAIL_VERIFICATION_ENABLED "${EMAIL_VERIFICATION_ENABLED:-false}" >> .env
                  write_env TWO_FACTOR_ENABLED "${TWO_FACTOR_ENABLED:-false}" >> .env
                  write_env TWO_FACTOR_PROVIDER_PASSWORD_FALLBACK "${TWO_FACTOR_PROVIDER_PASSWORD_FALLBACK:-true}" >> .env
                  write_env TWO_FACTOR_CODE_TTL_MINUTES "${TWO_FACTOR_CODE_TTL_MINUTES:-10}" >> .env
                  write_env TWO_FACTOR_MAX_ATTEMPTS "${TWO_FACTOR_MAX_ATTEMPTS:-5}" >> .env
                  write_env TWO_FACTOR_RESEND_COOLDOWN_SECONDS "${TWO_FACTOR_RESEND_COOLDOWN_SECONDS:-60}" >> .env
                  write_env TWO_FACTOR_MAX_RESENDS_PER_HOUR "${TWO_FACTOR_MAX_RESENDS_PER_HOUR:-5}" >> .env
                  write_env TWO_FACTOR_MAX_SKIPS_PER_HOUR "${TWO_FACTOR_MAX_SKIPS_PER_HOUR:-3}" >> .env

            - name: Deploy and verify backend
              run: bash ./deploy-be.sh

    frontend:
        name: Deploy frontend to Firebase Hosting
        runs-on: ubuntu-latest
        env:
            VITE_API_BASE_URL_INPUT: ${{ vars.VITE_API_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Build frontend
              working-directory: frontend
              run: |
                  export VITE_API_BASE_URL="${VITE_API_BASE_URL_INPUT:-https://bantu-bantu-proxy.novaldyhidayat.workers.dev}"
                  echo "Using VITE_API_BASE_URL=$VITE_API_BASE_URL"
                  test -n "$VITE_API_BASE_URL"
                  test -n "$VITE_GOOGLE_CLIENT_ID"
                  test -n "$FIREBASE_TOKEN"
                  npm run build

            - name: Install Firebase CLI
              run: npm install --global firebase-tools

            - name: Deploy Firebase Hosting
              working-directory: frontend
              run: firebase deploy --only hosting --project art-mngmnt --token "$FIREBASE_TOKEN"
