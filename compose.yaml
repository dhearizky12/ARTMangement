name: bantu-bantu

x-api: &api
  build:
    context: ./backend
    target: runtime
  init: true
  environment: &api-environment
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ASPNETCORE_HTTP_PORTS: "8080"
    Storage__RootPath: /app-data/documents
    Storage__Provider: ${STORAGE_PROVIDER:-Local}
    Storage__S3__ServiceUrl: ${STORAGE_S3_SERVICE_URL:-}
    Storage__S3__Region: ${STORAGE_S3_REGION:-auto}
    Storage__S3__AccessKey: ${STORAGE_S3_ACCESS_KEY:-}
    Storage__S3__SecretKey: ${STORAGE_S3_SECRET_KEY:-}
    Storage__S3__Bucket: ${STORAGE_S3_BUCKET:-}
    Storage__S3__KeyPrefix: ${STORAGE_S3_KEY_PREFIX:-provider-documents}
    ConnectionStrings__Default: ${DATABASE_URL:?Isi DATABASE_URL Neon di .env}
    Google__ClientId: ${GOOGLE_CLIENT_ID:?Isi GOOGLE_CLIENT_ID di .env}
    Jwt__PrivateKeyPath: /run/keys/private.pem
    Jwt__PublicKeyPath: /run/keys/public.pem
    Jwt__PrivateKeyBase64: ${JWT_PRIVATE_KEY_BASE64:-}
    Jwt__PublicKeyBase64: ${JWT_PUBLIC_KEY_BASE64:-}
    Jwt__KeyId: ${JWT_KEY_ID:?Isi JWT_KEY_ID di .env}
    Jwt__Issuer: ${JWT_ISSUER:?Isi JWT_ISSUER di .env}
    Jwt__Audience: ${JWT_AUDIENCE:?Isi JWT_AUDIENCE di .env}
    Jwt__AccessMinutes: ${JWT_ACCESS_MINUTES:-15}
    Jwt__RefreshDays: ${JWT_REFRESH_DAYS:-7}
    Frontend__Origin: ${FRONTEND_ORIGIN:?Isi FRONTEND_ORIGIN di .env}
    Frontend__Origins: ${FRONTEND_ORIGINS:-}
    Frontend__OriginPatterns: ${FRONTEND_ORIGIN_PATTERNS:-}
    AllowedHosts: ${ALLOWED_HOSTS:-localhost}
  volumes:
    - rsa_keys:/run/keys:ro
    - document_data:/app-data/documents
  depends_on:
    keys:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully

services:
  keys:
    build:
      context: ./docker
      dockerfile: keys.Dockerfile
    environment:
      KEY_OWNER_UID: "1654"
    volumes:
      - rsa_keys:/keys
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: migrations
    environment:
      DATABASE_URL: ${DATABASE_URL:?Isi DATABASE_URL Neon di .env}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
    restart: "no"

  wilayah-seed:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: scripts/seed.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Isi DATABASE_URL Neon di .env}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:?Isi API_BASE_URL di .env}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Isi GOOGLE_CLIENT_ID di .env}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  admin-seed:
    <<: *api
    profiles: ["tools"]
    environment:
      <<: *api-environment
      AdminSeed__Email: ${ADMIN_EMAIL:-}
      AdminSeed__Password: ${ADMIN_PASSWORD:-}
    command: ["--seed-admin"]
    restart: "no"

volumes:
  document_data:
  rsa_keys:
